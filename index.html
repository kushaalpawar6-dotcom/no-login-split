<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
  >

  <meta
    name="theme-color"
    content="#6c5ce7"
  >

  <title>No Login Split</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
      background: #f6f7fb;
      color: #202124;
    }

    button,
    input,
    select {
      font: inherit;
    }

    .app {
      width: 100%;
      max-width: 620px;
      margin: auto;
      padding: 18px;
    }

    header {
      text-align: center;
      padding: 28px 10px;
    }

    .logo {
      width: 64px;
      height: 64px;
      margin: auto;
      margin-bottom: 14px;
      border-radius: 18px;
      background: #6c5ce7;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      font-weight: 800;
      box-shadow: 0 10px 30px rgba(108,92,231,.25);
    }

    h1 {
      margin: 0;
      font-size: 31px;
      letter-spacing: -1px;
    }

    h2 {
      margin: 0 0 15px;
      font-size: 21px;
    }

    .tagline {
      margin: 7px 0 0;
      color: #777;
      font-size: 15px;
    }

    .card {
      background: white;
      border-radius: 20px;
      padding: 21px;
      margin-bottom: 16px;
      box-shadow: 0 5px 25px rgba(0,0,0,.06);
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-size: 13px;
      font-weight: 700;
      color: #666;
    }

    input,
    select {
      width: 100%;
      border: 1px solid #ddd;
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 12px;
      background: #fafafa;
      outline: none;
    }

    input:focus,
    select:focus {
      border-color: #6c5ce7;
      background: white;
    }

    button {
      width: 100%;
      border: 0;
      border-radius: 12px;
      padding: 14px 18px;
      background: #6c5ce7;
      color: white;
      font-weight: 700;
      cursor: pointer;
    }

    button:active {
      transform: scale(.98);
    }

    .secondary {
      background: #efedff;
      color: #5b4bd8;
    }

    .danger {
      background: #fff0f0;
      color: #d63031;
    }

    .hidden {
      display: none !important;
    }

    /*
      PERSON INPUTS
    */

    #peopleInputs {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 10px;
    }

    .person-row {
      display: flex;
      width: 100%;
      gap: 8px;
    }

    .person-row input {
      flex: 1;
      min-width: 0;
      margin: 0;
    }

    .remove-person {
      width: 48px;
      min-width: 48px;
      padding: 0;
      background: #fff0f0;
      color: #d63031;
      font-size: 22px;
    }

    .expense {
      padding: 15px 0;
      border-bottom: 1px solid #eee;
    }

    .expense:last-child {
      border-bottom: 0;
    }

    .expense-top {
      display: flex;
      justify-content: space-between;
      gap: 15px;
    }

    .expense-name {
      font-weight: 700;
    }

    .expense-meta {
      margin-top: 5px;
      color: #777;
      font-size: 13px;
    }

    .expense-amount {
      font-weight: 800;
      white-space: nowrap;
    }

    .balance {
      background: #f7f7fb;
      border-radius: 12px;
      padding: 13px;
      margin-bottom: 9px;
    }

    .balance-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .positive {
      color: #159957;
      font-weight: 700;
    }

    .negative {
      color: #d63031;
      font-weight: 700;
    }

    .small {
      color: #777;
      font-size: 13px;
      line-height: 1.5;
    }

    .share-box {
      margin-top: 14px;
      padding: 14px;
      background: #f4f2ff;
      border-radius: 13px;
      word-break: break-all;
      font-size: 13px;
    }

    .toast {
      position: fixed;
      left: 18px;
      right: 18px;
      bottom: 18px;
      max-width: 580px;
      margin: auto;
      padding: 14px;
      border-radius: 13px;
      background: #202124;
      color: white;
      text-align: center;
      display: none;
      z-index: 1000;
    }

    @media (max-width: 480px) {

      .app {
        padding: 13px;
      }

      header {
        padding: 23px 8px;
      }

      h1 {
        font-size: 28px;
      }

    }

  </style>

</head>


<body>

  <div class="app">

    <header>

      <div class="logo">
        ÷
      </div>

      <h1>
        No Login Split
      </h1>

      <p class="tagline">
        Split expenses. No login. No hassle.
      </p>

    </header>


    <!-- HOME -->

    <section id="homeScreen">

      <div class="card">

        <h2>
          Create a new trip
        </h2>

        <label>
          Trip name
        </label>

        <input
          id="tripName"
          type="text"
          placeholder="e.g. Goa Trip"
          autocomplete="off"
          autocapitalize="words"
        >


        <label>
          People
        </label>

        <!-- JavaScript creates EVERY person field -->

        <div id="peopleInputs"></div>


        <button
          id="addPersonBtn"
          class="secondary"
          type="button"
        >
          + Add person
        </button>


        <div style="height:10px"></div>


        <button
          id="createTripBtn"
          type="button"
        >
          Create Trip
        </button>

      </div>


      <div class="card">

        <h2>
          Already have a trip?
        </h2>

        <p class="small">
          Open the trip link someone shared with you.
          No login is required.
        </p>

      </div>

    </section>


    <!-- TRIP -->

    <section
      id="tripScreen"
      class="hidden"
    >


      <div class="card">

        <h2 id="tripTitle">
          Trip
        </h2>

        <p class="small">
          Everyone uses this same master link.
        </p>


        <div class="share-box">

          <strong>
            Master trip link
          </strong>

          <div
            id="tripLink"
            style="margin-top:7px"
          ></div>

        </div>


        <div style="height:10px"></div>


        <button
          id="shareBtn"
          class="secondary"
          type="button"
        >
          🔗 Share Trip
        </button>

      </div>


      <div class="card">

        <h2>
          Add expense
        </h2>


        <label>
          Description
        </label>

        <input
          id="expenseDescription"
          type="text"
          placeholder="e.g. Hotel"
          autocomplete="off"
        >


        <label>
          Amount
        </label>

        <input
          id="expenseAmount"
          type="number"
          inputmode="decimal"
          placeholder="₹ 0"
        >


        <label>
          Paid by
        </label>

        <select
          id="expensePaidBy"
        ></select>


        <button
          id="addExpenseBtn"
          type="button"
        >
          Add Expense
        </button>

      </div>


      <div class="card">

        <h2>
          Expenses
        </h2>

        <div id="expensesList"></div>

      </div>


      <div class="card">

        <h2>
          Balances
        </h2>

        <div id="balancesList"></div>

      </div>


    </section>

  </div>


  <div
    id="toast"
    class="toast"
  ></div>


  <!-- SUPABASE CONFIG -->

  <script>

    window.SUPABASE_URL =
      "https://yfrwgfadxoabvwiuwysf.supabase.co";

    window.SUPABASE_KEY =

  </script>


  <script src="app.js"></script>

</body>

</html>
